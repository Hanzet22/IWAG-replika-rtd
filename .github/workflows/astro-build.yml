name: IWAG Active Compiler and production build

on:
  push:
    branches:
      - main
      - "v2/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: iwag-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Rust Active Compiler → Astro/Vite
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Inspect compiler source manifest
        run: npm run compiler:inspect
      - name: Build optional Rust/WASM contrast engine
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --locked --version 0.15.0
          npm run wasm:build
      - name: Run Active Compiler production build
        run: npm run build
      - name: Upload production build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iwag-build-report
          path: .iwag-build/iwag-build-report.json
          if-no-files-found: ignore
